                  icon: >-
                    {% if is_state(config.entity,'on')%} ph:waveform-bold

                    {% elif is_state(config.entity, 'unavailable') %}
                    mdi:alert-circle

                    {% else %} 

                    {% endif %}
                  icon_color: |-
                    {% if is_state(config.entity,'on')%} white
                    {% elif is_state(config.entity, 'unavailable') %} red
                    {% else %} 
                    {% endif %}
                  tap_action:
                    action: more-info
                  hold_action:
                    action: none
                  double_tap_action:
                    action: none
            alignment: start
            card_mod:
              style:
                mushroom-template-chip:nth-child(2)$: |
                  {% include 'shadow_chip_icon.jinja' %}
                mushroom-conditional-chip:nth-child(3):
                  mushroom-template-chip$: |
