type: sections
max_columns: 6
title: Обзор
path: default
sections:
  - type: grid
    cards:
      - type: heading
        icon: mdi:star
        heading_style: title
        badges:
          - type: entity
            show_state: false
            show_icon: true
            entity: binary_sensor.zamok_contact
            tap_action:
              action: more-info
            visibility:
              - condition: state
                state: 'off'
          - type: entity
            show_state: false
            show_icon: true
            entity: binary_sensor.zamok_indoor_contact
            icon: mdi:account-lock
            color: red
            tap_action:
              action: more-info
            visibility:
              - condition: state
                state: 'off'
          - type: entity
            show_state: false
            show_icon: true
            entity: binary_sensor.router_master
            icon: mdi:web-check
            visibility:
              - condition: state
                state: 'on'
          - type: entity
            show_state: false
            show_icon: true
            entity: >-
              binary_sensor.keenetic_giga_ed4de2_wireguard_kotikey_5121332_connection
            icon: mdi:vpn
            visibility:
              - condition: state
                state: 'on'
          - type: entity
            show_state: true
            show_icon: true
            entity: input_datetime.vremia
            visibility:
              - condition: state
                entity: automation.budilnik_2
                state: 'on'
          - type: entity
            show_state: false
            show_icon: true
            entity: sensor.otzhimaniia
            color: red
            visibility:
              - condition: state
                entity: calendar.health
                state: 'off'
          - type: entity
            show_state: false
            show_icon: true
            entity: input_boolean.nochnoi_rezhim
            icon: mdi:creation
            visibility:
              - condition: state
                state: 'on'
            color: purple
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.count_persons
            icon: mdi:account-multiple
            visibility:
              - condition: numeric_state
                above: 0
          - type: entity
            show_state: true
            show_icon: true
            entity: weather.pogoda
            state_content: temperature
            tap_action:
              action: more-info
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.temp_home
            icon: mdi:thermometer
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.diapazon_iarkost_doma_dlia_dashborda
            icon: mdi:white-balance-sunny
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.svet_vezde
            icon: mdi:lightbulb
            visibility:
              - condition: numeric_state
                above: 0
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.count_media_all
            icon: mdi:monitor-speaker
            visibility:
              - condition: numeric_state
                above: 0
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.count_climate_all
            icon: mdi:home-thermometer
            tap_action:
              action: none
            visibility:
              - condition: numeric_state
                above: 0
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.count_open_doors
            icon: fas:door-open
            visibility:
              - condition: numeric_state
                above: 0
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.count_open_windows
            icon: mdi:window-open-variant
            visibility:
              - condition: numeric_state
                above: 0
          - type: entity
            show_state: true
            show_icon: true
            entity: sensor.kukhnia_aerogril_taimer_aerogril
            icon: material-symbols-light:multicooker
            visibility:
              - condition: state
                entity: binary_sensor.air_fryer_state_on
                state: 'on'
          - type: entity
            show_state: true
            show_icon: true
            entity: timer.washing
            state_content: remaining_time
            icon: mdi:washing-machine
            visibility:
              - condition: state
                state: active
          - type: entity
            show_state: false
            show_icon: true
            entity: binary_sensor.dvizhenie_v_kvartire
            icon: mdi:run-fast
            visibility:
              - condition: state
                state: 'on'
          - type: button
            icon: mdi:pig-variant
            tap_action:
              action: navigate
              navigation_path: '#kopilka'
            text: ' ›'
    column_span: 6
  - type: grid
    cards:
      - type: heading
        icon: mdi:cctv
        heading_style: title
        badges: []
        heading: Камеры
      - type: custom:vertical-stack-in-card
        cards:
          - show_state: false
            show_name: false
            camera_view: auto
            aspect_ratio: auto
            type: picture-entity
            camera_image: camera.gostinaia
            entity: camera.gostinaia
            tap_action:
              action: navigate
              navigation_path: '#c200'
            hold_action:
              action: none
            card_mod:
              style: |
                ha-card {
                  bottom: 0px !important;
                  left: 0px !important;
                  background-color: rgba(0,0,0,0.5) !important;
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                content: Гостиная
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: template
                entity: switch.gostinaia_privacy
                icon: >-
                  {% if is_state(config.entity,'on')%} mdi:eye-off

                  {% elif is_state(config.entity, 'unavailable') %}
                  mdi:alert-circle

                  {% else %} mdi:eye

                  {% endif %}
                icon_color: |-
                  {% if is_state(config.entity,'on')%} white
                  {% elif is_state(config.entity, 'unavailable') %} red
                  {% else %} white
                  {% endif %}
                tap_action:
                  action: toggle
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.gostinaia_cell_motion_detection
                    state: 'on'
                chip:
                  type: template
                  entity: binary_sensor.gostinaia_cell_motion_detection
                  icon: >-
                    {% if is_state(config.entity,'on')%} mdi:motion

                    {% elif is_state(config.entity, 'unavailable') %}
                    mdi:alert-circle

                    {% else %} 

                    {% endif %}
                  icon_color: |-
                    {% if is_state(config.entity,'on')%} white
                    {% elif is_state(config.entity, 'unavailable') %} red
                    {% else %} 
                    {% endif %}
                  tap_action:
                    action: more-info
                  hold_action:
                    action: none
                  double_tap_action:
                    action: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.gostinaia_noise
